[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legawa"
version = "0.1.0"
description = "Multi-agent assistant for Indonesian legislators (DPR/DPRD)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.3.0",
    "pydantic>=2.7.0",
]

[project.scripts]
legawa = "legawa.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/legawa"]
